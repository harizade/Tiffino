<div class="position-fixed top-0 start-0 end-0 z-3">
  <app-navbar></app-navbar>
</div>

<div class="container ">
  <div *ngFor="let order of orders" class="card mb-3 shadow-sm p-3">
    <div *ngFor="let meal of order.orderMealsResponses" class="d-flex align-items-center justify-content-between mb-3">
      
      <!-- Left: Image + Details -->
      <div class="rotaition d-flex">
        <div class="d-flex align-items-center">
        <img [src]="meal.mealPhotos"
             alt="{{ meal.mealName }}"
             class="img-thumbnail me-3"
             style="width: 80px; height: 80px; object-fit: cover;">

        <div>
          <h6 class="mb-1">{{ meal.mealName }}</h6>
          <p class="text-muted mb-0">Date: {{ order.orderDate }}</p>
        </div>
      </div>
      </div>

      <!-- Right: Price + Status -->
      <div class="main ">
        <div class="text-end">
        <p class="fw-semibold mb-1">₹{{ order.totalCost }}</p>

        <p class="mb-1">
          <span *ngIf="order.orderStatus === 'DELIVERED'" class="text-success fw-bold">
            ✔ Delivered on {{ order.orderDate }}
          </span>
          <span *ngIf="order.orderStatus === 'ASSIGNED_TO_DELIVERY'" class="text-warning fw-bold">
             Out for Delivery
          </span>
          <span *ngIf="order.orderStatus === 'CANCELLED'" class="text-danger fw-bold">
            ✘ Cancelled
          </span>
        </p>

        <a href="" class="text-primary fw-semibold">
          ⭐ Rate & Review Product
        </a>
      </div>
      </div>
    </div>
  </div>
</div>
