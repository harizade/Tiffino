      
     <div class="container">
        <div class="row mt-3">
            <div class="col-md-6">
             <div class="card shadow-sm p-1">
        <h4 class="mb-2">Add Delivery Person</h4>
        
        
       <form [formGroup]="addDeliveryPersonForm" (ngSubmit)="addDeliveryPerson()">
          
          <div class="mb-2">
            <label class="form-label">Name </label>
            <input type="text" class="form-control" placeholder="Enter Name" formControlName="name"  required>
          </div>

          <div class="mb-2">
            <label class="form-label">Email</label>
            <input type="email" class="form-control"placeholder="Enter Email" formControlName="email"  required>
          </div>

          <div class="mb-2">
            <label class="form-label">Phone Number </label>
            <input type="number" class="form-control"placeholder="Enter Phone" formControlName="phoneNo"  required>
          </div>

           <div class="mb-2">
              <label class="form-label">Adhar Card</label>
              <input type="file" class="form-control" (change)="onFileSelect($event, 'adharCard')" required />
            </div>

            <div class="mb-2">
              <label class="form-label">Licences</label>
              <input type="file" class="form-control" (change)="onFileSelect($event, 'licences')" required />
            </div>

            <div class="mb-2">
              <label class="form-label">Insurance</label>
              <input type="file" class="form-control" (change)="onFileSelect($event, 'insurance')" required />
            </div>

            <div class="mb-2">
            <label class="form-label">CloudKitchen Id </label>
            <input type="text" class="form-control" placeholder="Enter CloudKitchen Id" formControlName="cloudKitchenId"  required>
          </div>

          <button class=" button border-0 w-100 text-white p-1 mt-3 mb-2" >Submit</button>
           </form>

      </div>
    </div>

     <div class="card shadow-sm mt-">

      <th>Cloud Kitchen Id</th>
      <th>Delivery Persons</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let row of data">
      <td>{{ row.cloudKitchenId }}</td>
      <td>
        {{ row.deliveryPersons.length ? row.deliveryPersons.join(', ') : 'No delivery person' }}

  </tbody>
