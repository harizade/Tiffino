
     <div class="container">
        <div class="row mt-3">
            <div class="col-md-6">
             <div class="card shadow-sm p-1">
        <h4 class="mb-2">Add Manager</h4>
        
        
       <form [formGroup]="addManagerForm" (ngSubmit)="saveManager()">
          <div class="row mb-3">
            <div class="col-md-6">
              <label class="form-label">Manager Name</label>
              <input type="text" class="form-control" formControlName="managerName" required />
            </div>
            <div class="col-md-6 position-relative">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" formControlName="managerEmail" required />
            <span class="text-danger error-msg"   *ngIf="addManagerForm.get('managerEmail')?.hasError('email') && addManagerForm.get('managerEmail')?.touched">
              Please enter a valid email address.
              </span>
            </div>
          </div>

          <div class="row mb-2">
            <div class="col-md-6">
              <label class="form-label">Dob</label>
              <input type="date" class="form-control" formControlName="dob" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone No</label>
              <input type="number" class="form-control" formControlName="phoneNo" required />
            </div>
          </div>

          <div class="row mb-2">
            <div class="col-md-6">
              <label class="form-label">Current Address</label>
              <input type="text" class="form-control" formControlName="currentAddress" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Permeant Address</label>
              <input type="text" class="form-control" formControlName="permeantAddress" required />
            </div>
          </div>

          <div class="row mb-2">
            <div class="col-md-6">
              <label class="form-label">Adhar Card</label>
              <input type="file" class="form-control" (change)="onFileSelect($event, 'adharCard')" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Pan Card</label>
              <input type="file" class="form-control" (change)="onFileSelect($event, 'panCard')" required />
            </div>
          </div>

          <div class="row mb-2">
            <div class="col-md-6">
              <label class="form-label">Photo</label>
              <input type="file" class="form-control" (change)="onFileSelect($event, 'photo')" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">City</label>
              <input type="text" class="form-control" formControlName="city" required />
            </div>
          </div>

          <div class="row mb-2">
            <div class="col-md-6">
              <label class="form-label">Cloud Kitchen Id</label>
              <input type="text" class="form-control" formControlName="cloudKitchenId" required />
            </div>
          </div>

          <div class="col-12">
            <button type="submit" class="button border-0 w-100 text-white p-1 mt-2">Submit</button>
          </div>
        </form>




      </div>
    </div>


     <div class="col-md-6">
     <div class="card shadow-sm mt-">
        <h4 class="card-header">Cloud Kitchen Data</h4>
        <div class="card-body p-0">
          <div class="table-responsive">

            <table class="table table-bordered table-striped mb-0">
              <thead class="table-light">
                <tr>
                  <th>Manager_Id</th>
                  <th>Cloud Kitchen_Id</th>
                  <th>State</th>
                  <th>City</th>
                  <th>Division</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let row of data">
                <td>{{ row.managerId }}</td>
                <td>{{ row.cloudKitchenId }}</td>
                <td>{{ row.cloudKitchenState }}</td>
                <td>{{ row.cloudKitchenCity }}</td>
                <td>{{ row.cloudKitchenDivision }}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
            </div> 
        </div>
    </div>
