<div class="position-fixed top-0 start-0 end-0 z-3">
  <app-navbar></app-navbar>
</div>

<div class="main">
<div class="container d-flex justify-content-center">
  <div class="card shadow p-3">
    <h3 class="text-center fw-bold">Update Profile</h3>
    <form [formGroup]="editProfileForm" (ngSubmit)="editUser()">
      <div class="mb-2">
        <label for="name" class="form-label">Edit Name</label>
        <input type="text" id="" class="form-control custom-border" formControlName="name" required>
      </div>

      <div class="mb-2">
        <label for="email" class="form-label">Edit Address</label>
        <input type="text" id="" class="form-control custom-border" formControlName="address" required>
      </div>

      
      <div class="mb-2">
        <label for="email" class="form-label">Edit Meal Preference</label>
        <input type="text" id="" class="form-control custom-border" formControlName="mealPreference" required>
      </div>

      <div class="mb-2">
        <label for="password" class="form-label">Edit Dietary Needs</label>
        <input type="text" id="" class="form-control custom-border" formControlName="dietaryNeeds" required>
      </div>

      <button type="submit" class="button border-0 w-100 text-white p-1 mt-3 mb-2">Save</button>
    </form>
  </div>
</div>

</div>
