<div class="position-fixed top-0 start-0 end-0 z-3">
  <app-navbar></app-navbar>
</div>

<div class="main">
 <div class="container mt-5" *ngIf="data">
  <div class="card shadow-lg border-0 rounded-4 p-4">
    <div class="row align-items-center">
      
      <!-- Avatar -->
      <div class="col-md-3 text-center">
        <img src="https://i.ibb.co/9gZ7RzV/default-avatar.png" 
             alt="Profile Photo" 
             class="rounded-circle img-fluid shadow-sm"
             style="width: 120px; height: 120px; object-fit: cover;">
      </div>

      <!-- User Info -->
      <div class="col-md-7">
        <h3 class="fw-bold text-dark mb-1">{{ data.userName }}</h3>
        <p class="text-muted mb-2">{{ data.email }}</p>
        <span class="badge bg-primary px-3 py-2">{{ data.role }}</span>
      </div>

      <!-- Edit Button -->
      <div class="col-md-2 text-end">
        <button class="btn btn-outline-primary rounded-pill px-4">
          <i class="bi bi-pencil"></i> Edit
        </button>
      </div>
    </div>

    <hr class="my-4">

    <!-- Profile Details -->
    <div class="row">
      <div class="col-md-6 mb-3">
        <h6 class="text-muted">User ID</h6>
        <p class="fw-semibold">{{ data.userId }}</p>
      </div>
      <div class="col-md-6 mb-3">
        <h6 class="text-muted">Phone</h6>
        <p class="fw-semibold">{{ data.phoneNo }}</p>
      </div>
      <div class="col-md-6 mb-3">
        <h6 class="text-muted">Address</h6>
        <p class="fw-semibold">{{ data.address || 'Not provided' }}</p>
      </div>
      <div class="col-md-6 mb-3">
        <h6 class="text-muted">Meal Preference</h6>
        <p class="fw-semibold">{{ data.mealPreference || 'Not specified' }}</p>
      </div>
      <div class="col-md-6 mb-3">
        <h6 class="text-muted">Dietary Needs</h6>
        <p class="fw-semibold">{{ data.dietaryNeeds || 'Not specified' }}</p>
      </div>
    </div>
  </div>
</div>

</div>
