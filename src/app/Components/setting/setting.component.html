<div class="container d-flex justify-content-center">
  <div class="card shadow p-3">
    <h3 class="text-center fw-bold">Setting</h3>
    <form>

      <!-- Name -->
      <div class="mb-2">
        <label for="name" class="form-label">Edit Name</label>
        <input type="text" id="name" class="form-control custom-border" name="name" required>
      </div>

      <div class="mb-2">
        <label for="email" class="form-label">Edit Email</label>
        <input type="email" id="name" class="form-control custom-border" name="email" required>
      </div>

      <div class="mb-2">
        <label for="password" class="form-label">Edit Password</label>
        <input type="password" id="name" class="form-control custom-border" name="password" required>
      </div>

      

      <!-- Submit -->
      <button type="submit" class="button border-0 w-100 text-white p-1 mt-3 mb-2">Save</button>
    </form>
  </div>
</div>
