<div class="container d-flex justify-content-center">
  <div class="card shadow p-3">
    <h3 class="text-center fw-bold">Update Profile</h3>
    <form [formGroup]="adminForm" (ngSubmit)="updateAdmin()">
      <div class="mb-2">
        <label for="name" class="form-label">Edit Name</label>
        <input type="text" id="" class="form-control custom-border" formControlName="adminName" required>
      </div>

      <div class="mb-2">
        <label for="email" class="form-label">Edit Email</label>
        <input type="email" id="" class="form-control custom-border" formControlName="email" required>
      </div>

      <div class="mb-2">
        <label for="password" class="form-label">Edit Password</label>
        <input type="password" id="" class="form-control custom-border" formControlName="password" required>
      </div>

      <button type="submit" class="button border-0 w-100 text-white p-1 mt-3 mb-2">Save</button>
    </form>
  </div>
</div>
