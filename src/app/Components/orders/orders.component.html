<div class="container">
    <div class="row">
        <div class="col-md-12">
           <!-- <div class="col-md-6"> -->
     <div class="card shadow-sm mt-">
        <div class="card-header">All Orders</div>
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-bordered table-striped mb-0">
              <thead class="table-light">
                <tr>
                  <th>#</th>
                  <th>Order_Id</th>
                  <th>Customer Name</th>
                  <th>Total Amount</th>
                  <th>Status</th>
                  <th>Address</th>
                  <th>Order Date</th>
                  <th>Order Time</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let row of data ,let i=index">
                  <td>{{i+1}}</td>
                  <td>{{row.orderId}}</td>
                  <td>{{row.userName}}</td>
                  <td>{{row.totalCost}}</td>
                  <td>{{row.orderStatus}}</td>
                  <td>{{row.address}}</td>
                  <td>{{row.orderDate}}</td>
                  <td>{{row.orderTime}}</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
            </div>
        </div>
    </div>
