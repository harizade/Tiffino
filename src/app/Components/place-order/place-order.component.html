<div class="position-fixed top-0 start-0 end-0 z-3">
  <app-navbar></app-navbar>
</div>

<div class="main">
   <div class="container d-flex justify-content-center">
  <div class="card shadow p-3">
    <h3 class="text-center fw-bold">Place Order</h3>
    <form [formGroup]="placeOrderForm" (ngSubmit)="placeOrder()">

      <div class="mb-2">
        <label for="phoneNo" class="form-label">Phone No</label>
        <input type="text" id="phoneNo" class="form-control custom-border" formControlName="phoneNo" required>
      </div>

      <div class="mb-2">
        <label for="state" class="form-label">State</label>
        <input type="text" id="state" class="form-control custom-border" formControlName="state" required>
      </div>

      <div class="mb-2">
        <label for="city" class="form-label">City</label>
        <input type="text" id="city" class="form-control custom-border" formControlName="city" required>
      </div>

      <div class="mb-2">
        <label for="address" class="form-label">Address</label>
        <input type="text" id="address" class="form-control custom-border"  formControlName="address" required>
      </div>

      <div class="mb-2">
        <label for="pinCode" class="form-label">Pin Code</label>
        <input type="number" id="pinCode" class="form-control custom-border"  formControlName="pinCode" required>

      </div>
      

     

     

      <!-- Submit -->
      <button type="submit" class="button border-0 w-100 text-white p-1">Submit</button>
    </form>
  </div>
</div>
</div>
