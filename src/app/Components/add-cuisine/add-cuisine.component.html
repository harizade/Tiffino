<div class="container d-flex justify-content-center">
  <div class="card shadow p-3">
    <h3 class="text-center fw-bold">Add Cuisine</h3>
    <form>

      <!-- Name -->
      <div class="mb-2">
        <label for="name" class="form-label">Cuisine Name</label>
        <input type="text" id="name" class="form-control custom-border" name="name" required>
      </div>

      <!-- Description -->
      <div class="mb-2">
        <label for="description" class="form-label">Description</label>
        <textarea class="form-control custom-border" name="description" rows="3"></textarea>
      </div>

      <!-- Submit -->
      <button type="submit" class="button border-0 w-100 text-white p-1 mt-3 mb-2">Submit</button>
    </form>
  </div>
</div>
