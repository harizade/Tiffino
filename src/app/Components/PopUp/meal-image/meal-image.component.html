<div class="meal position-relative d-inline-block">
    <img
        [src]="data.photos"
        alt="Meal Image"
        width="400"
        height="300"
    >
    <button class="cross position-absolute top-0 end-0 m-2" (click)="popup.closeAll()"><span>✖</span></button>
    <p>{{ data.mealName }}</p>
    <p>Price ₹ {{data.price}} /-</p>
     <p>{{data.description}}</p>
     <p>{{data.nutritionalInformation}}</p>

   <button class="btn btn-outline-success card-button ">Add</button>

</div>
