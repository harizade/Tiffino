<div class="p-6 bg-gray-100 min-h-screen">
  <h2 class="text-2xl text-dark font-semibold mb-6 text-gray-800">
    🧾 Customer Complaints
  </h2>

  <div class="space-y-6">
    <!-- Loop through all complaints -->
    <div
      *ngFor="let c of complaints"
      class="border bg-white text-black rounded-2xl shadow-md p-4 hover:shadow-lg transition d-flex flex-row md:flex-row items-start md:items-center gap-4 "
    >
      

       <div class="flex-shrink-0 w-full md:w-48">
        <img
          *ngIf="c.imageUrl; else noImage"
          [src]="c.imageUrl"
          alt="Complaint Image"
          class="w-full h-40 object-cover rounded-xl border border-gray-200"
        />
        <ng-template #noImage>
          <img
            src="./../../../assets/images/no-image.png"
            alt="No image available"
            class="w-full h-40 object-cover rounded-xl border border-gray-200 opacity-60"
          />
        </ng-template>
      </div>

      <!-- Right side: details -->
      <div class="flex flex-row justify-between text-gray-800">
        <h3 class="text-xl font-semibold mb-2">{{ c.customerName }}</h3>

        <p class="text-sm mb-1">
          <strong>📞 Phone:</strong> {{ c.customerPhoneNo }}
        </p>
        <p class="text-sm mb-1">
          <strong>🏠 Address:</strong> {{ c.customerAddress }}
        </p>
        <p class="text-sm mb-1">
          <strong>🧾 Order ID:</strong> {{ c.orderId }}
        </p>
        <p class="text-sm text-red-600 font-semibold mt-2">
          ⚠️ Complaint: {{ c.complaint }}
        </p>
        
      </div>
    </div>
  </div>

  <!-- Empty state -->
  <div *ngIf="complaints.length === 0" class="text-gray-500 text-center mt-8">
    No complaints found.
  </div>
</div>
